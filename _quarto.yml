project:
  type: website
  output-dir: docs
  render:
    - "index.qmd"
    - "posts/"

website:
  title: "Build Journal"
  description: "Notes on the learning, decision, and analytics tools I build."
  search: false

format:
  html:
    theme: default
    css: styles.css
    toc: false
    # No math on this site. "plain" loads no JS. The default (mathjax) pulls
    # ~1MB of MathJax plus a CDN polyfill onto every page.
    html-math-method: plain
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&display=swap" rel="stylesheet">
