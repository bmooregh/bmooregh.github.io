on:
  push:
    branches: main
  workflow_dispatch:

name: Publish Site

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          # Pinned. The default installs the latest release, so an upstream
          # Quarto change can break this build with no commit from us.
          version: 1.9.37

      - name: Render
        uses: quarto-dev/quarto-actions/render@v2

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          # Creates the Pages site if it does not exist yet. Without this the
          # action only reads an existing site and fails with
          # "Get Pages site failed" / HttpError: Not Found.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
